services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: skill_forge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skill_forge_db
    ports:
      - "5433:5432" # 5433 is Windows Host port (avoids conflict with erp_backend on 5432). 5432 is internal container port.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Go Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skill_forge_api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres # Internal Docker hostname to connect Go container to PostgreSQL container
    depends_on:
      - postgres

volumes:
  postgres_data:
